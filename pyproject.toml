[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "birthday-sync"
version = "0.1.0"
description = "Pull friend birthdays out of Facebook and Snapchat into one de-duplicated ICS calendar."
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "birthdays contributors" }]
keywords = ["birthdays", "calendar", "ics", "facebook", "snapchat", "playwright"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Scheduling",
]
dependencies = [
    "playwright>=1.40",
    "click>=8.1",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[dependency-groups]
dev = ["pytest>=8.0"]

[project.urls]
Homepage = "https://github.com/jcthewizard/birthdays"
Source = "https://github.com/jcthewizard/birthdays"

[project.scripts]
birthdays = "birthdays.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["birthdays"]

[tool.hatch.build.targets.sdist]
include = ["birthdays", "tests", "README.md", "LICENSE"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = ["error"]
